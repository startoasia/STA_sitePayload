services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://payload_user:payload_password@db:5432/payload_db?schema=public
      - PAYLOAD_SECRET=your_super_secret_payload_key_here
      # If you access the site via a domain:
      # - NEXT_PUBLIC_SERVER_URL=https://your-domain.com
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist local uploads (if using local media storage)
      - media_data:/app/media

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=payload_user
      - POSTGRES_PASSWORD=payload_password
      - POSTGRES_DB=payload_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload_user -d payload_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  media_data:
  postgres_data:
